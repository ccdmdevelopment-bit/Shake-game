<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Soda Slinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* One-screen arcade: the canvas is the diner, DOM cards float over it like menu cards */
:root{
  --red:#e8223f; --red-dk:#a8102a; --pink:#f0407a; --cream:#fff7ef; --ink:#2a1630;
  --teal:#3fc0cc; --mint:#4fd36a; --gold:#ffc83a; --lock:#b9aebf;
  --display:'Lilita One','Arial Black',Impact,sans-serif;
  --body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#43c2ce}
body{font-family:var(--body);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;background:rgba(42,22,48,.38)}
.screen.clear{background:transparent}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);
  width:min(460px,100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:20px 20px 24px;text-align:center;
  display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--red);letter-spacing:.5px;text-wrap:balance;
  text-shadow:2px 2px 0 var(--ink)}
.card p{margin:0;font-size:16px;line-height:1.4}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:22px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:14px;
  box-shadow:0 5px 0 var(--ink);padding:9px 20px;cursor:pointer;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.lvl:focus-visible,.icon:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.alt{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
.btn.big{font-size:32px;padding:12px 38px}
.logo{display:inline-block;background:var(--red);color:#fff;font-family:var(--display);line-height:.88;
  padding:18px 30px 16px;border-radius:48% 52% 46% 54% / 58% 50% 50% 42%;transform:rotate(-5deg);
  text-shadow:3px 3px 0 var(--red-dk);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink)}
.logo span{display:block;font-size:clamp(44px,12vw,78px)}
.logo span+span{font-size:clamp(50px,14vw,92px)}
#title .stack{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
#title .tag{font-family:var(--display);font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px}
.toggles{display:flex;gap:10px;justify-content:center}
.icon{font-family:var(--body);font-weight:700;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:12px;
  box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;color:var(--ink)}
.icon[aria-pressed="false"]{background:var(--lock);text-decoration:line-through}
#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);
  width:46px;height:46px;font-size:24px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
#worlds .card{width:min(900px,100%)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;text-align:left}
.world{border:3px solid var(--ink);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;color:#fff}
.world .wname{font-family:var(--display);font-size:21px;text-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.world .wname small{font-family:var(--body);font-weight:600;font-size:13px;text-shadow:none;opacity:.95}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl{aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font-family:var(--display);
  font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--ink)}
.lvl .st{font-size:11px;letter-spacing:-1px;color:var(--gold);-webkit-text-stroke:.6px var(--ink);line-height:1}
.lvl:disabled{background:var(--lock);cursor:not-allowed;box-shadow:none;opacity:.8}
.stars{font-size:52px;letter-spacing:6px;line-height:1;-webkit-text-stroke:2px var(--ink)}
.stars .on{color:var(--gold)} .stars .off{color:#e6dde8}
.muted{color:#6b5872;font-size:14px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen clear">
  <div class="stack">
    <div class="logo" aria-label="Soda Slinger"><span>SODA</span><span>SLINGER</span></div>
    <div class="tag">Slide the shake. Stop it in the green.</div>
    <button class="btn big" id="playBtn">Play</button>
    <div class="toggles">
      <button class="icon" id="musT1" aria-pressed="true">♫ Music</button>
      <button class="icon" id="sfxT1" aria-pressed="true">🔊 Sound</button>
    </div>
  </div>
</div>

<div id="worlds" class="screen" hidden>
  <div class="card">
    <h2>Pick a Counter</h2>
    <div class="worlds" id="worldList"></div>
    <div class="row"><button class="btn ghost" id="backTitle">Back</button></div>
  </div>
</div>

<div id="pause" class="screen" hidden>
  <div class="card">
    <h2>On Break</h2>
    <div class="row"><button class="btn" id="resumeBtn">Resume</button></div>
    <div class="row">
      <button class="btn alt" id="restartBtn">Restart</button>
      <button class="btn ghost" id="levelsBtn">Levels</button>
    </div>
    <div class="toggles">
      <button class="icon" id="musT2" aria-pressed="true">♫ Music</button>
      <button class="icon" id="sfxT2" aria-pressed="true">🔊 Sound</button>
    </div>
  </div>
</div>

<div id="done" class="screen" hidden>
  <div class="card">
    <h2 id="doneTitle">Order Up!</h2>
    <div class="stars" id="doneStars"></div>
    <p id="doneMsg"></p>
    <div class="row">
      <button class="btn ghost" id="doneLevels">Levels</button>
      <button class="btn alt" id="doneRetry">Retry</button>
      <button class="btn" id="doneNext">Next</button>
    </div>
  </div>
</div>

<button class="icon" id="pauseBtn" aria-label="Pause" hidden>≡</button>
<div id="safeProbe" style="position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>

<script>
'use strict';
/* =====================================================================
   SODA SLINGER — slide milkshakes down the counter into the green zone
   ===================================================================== */

// ---------- constants ----------
const HW = 22;            // shake half-width (world units)
const GRAV = 1500;        // fall gravity
const LAND_TOL = 22;      // how far a shake can dip and still land across a gap
const SPILL_V = 430;      // hitting a solid thing faster than this tips the shake
const START_X = 120;
const SHAKES_PER_LEVEL = 3;
const SURF_DECEL = { syrup: 1150, sand: 1000, ice: 60, wet: 85, oil: 45 };
const SURF_NAME = { syrup: 'syrup', sand: 'sand', ice: 'ice', wet: 'wet boards', oil: 'oil' };

const WORLDS = [
  { name: 'Main Street Diner', theme: 'diner', decel: 320, meter: 3.0, flavor: 'choc',   song: 0, tag: 'Syrup spills & pie domes' },
  { name: 'Midnight Neon',     theme: 'neon',  decel: 320, meter: 2.7, flavor: 'straw', song: 1, tag: 'Ice slicks & counter gaps' },
  { name: 'Boardwalk Shack',   theme: 'beach', decel: 340, meter: 2.45, flavor: 'mint',  song: 2, tag: 'Sand, wet boards & crabs' },
  { name: 'Orbit Café',        theme: 'space', decel: 230, meter: 2.25, flavor: 'galaxy',song: 3, tag: 'Conveyor belts & lasers' },
];

// a = start x, b = end x. Zones are [from, to]. Gates cycle open/closed with period p.
const LEVELS = [
  // --- Main Street Diner
  { end: 1150, zone: [760, 1020], tip: 'Hold to wind up — let go to slide!' },
  { end: 1350, zone: [1000, 1230], tip: 'Landed shakes stay put. Don’t knock them off!' },
  { end: 1550, zone: [1180, 1380], surf: [{ k: 'syrup', a: 600, b: 780 }], tip: 'Sticky syrup slows your shake down' },
  { end: 1600, zone: [1150, 1340], surf: [{ k: 'syrup', a: 480, b: 620 }], obs: [{ k: 'bottle', x: 1378 }], tip: 'Bounce off the ketchup — gently!' },
  { end: 1800, zone: [1380, 1550], surf: [{ k: 'syrup', a: 1050, b: 1150 }], gates: [{ k: 'dome', x: 800, p: 2.6 }], tip: 'Time it so the pie dome is up' },
  // --- Midnight Neon
  { end: 1700, zone: [1280, 1460], surf: [{ k: 'ice', a: 650, b: 1000 }], tip: 'Spilled ice is super slippery' },
  { end: 1750, zone: [1300, 1470], gaps: [[680, 770]], tip: 'Slide fast enough to hop the gap' },
  { end: 1800, zone: [1420, 1580], gaps: [[560, 650]], surf: [{ k: 'ice', a: 850, b: 1150 }], obs: [{ k: 'bottle', x: 1618 }] },
  { end: 1900, zone: [1480, 1640], gaps: [[520, 600], [880, 960]], gates: [{ k: 'dome', x: 1200, p: 2.2 }] },
  { end: 1880, zone: [1650, 1800], gaps: [[820, 910]], surf: [{ k: 'ice', a: 380, b: 700 }, { k: 'syrup', a: 1250, b: 1380 }], tip: 'Careful — the counter ends right after the green' },
  // --- Boardwalk Shack
  { end: 1700, zone: [1250, 1420], surf: [{ k: 'sand', a: 620, b: 800 }], tip: 'Sand grabs the glass' },
  { end: 1750, zone: [1330, 1480], gaps: [[520, 620]], surf: [{ k: 'sand', a: 900, b: 1000 }] },
  { end: 1800, zone: [1380, 1530], gates: [{ k: 'crab', x: 900, p: 2.8 }], obs: [{ k: 'bottle', x: 1570 }], tip: 'Wait for the crab to duck' },
  { end: 1850, zone: [1480, 1630], gaps: [[440, 530], [960, 1040]], surf: [{ k: 'wet', a: 600, b: 880 }] },
  { end: 1950, zone: [1760, 1890], gaps: [[700, 790]], surf: [{ k: 'sand', a: 450, b: 600 }, { k: 'wet', a: 1050, b: 1300 }], gates: [{ k: 'crab', x: 1450, p: 2.4 }] },
  // --- Orbit Café
  { end: 1800, zone: [1400, 1560], belts: [{ a: 600, b: 1000, s: 160 }], tip: 'Belts push your shake along' },
  { end: 1800, zone: [1300, 1450], belts: [{ a: 650, b: 1100, s: -170 }], tip: 'This belt runs backwards!' },
  { end: 1700, zone: [1480, 1620], gates: [{ k: 'laser', x: 750, p: 2.2 }], belts: [{ a: 1000, b: 1300, s: 130 }], tip: 'Lasers zap shakes. Wait for it to switch off' },
  { end: 1850, zone: [1580, 1720], gaps: [[560, 660]], belts: [{ a: 900, b: 1200, s: -140 }], gates: [{ k: 'laser', x: 1350, p: 2.0 }] },
  { end: 2150, zone: [1960, 2090], belts: [{ a: 450, b: 700, s: 150 }, { a: 1300, b: 1550, s: -150 }], gaps: [[850, 950]], surf: [{ k: 'oil', a: 1100, b: 1250 }], gates: [{ k: 'laser', x: 1700, p: 1.9 }], tip: 'Final order. Good luck!' },
];

// ---------- persistence ----------
const SAVE_KEY = 'sodaSlinger.v1';
let save = { stars: LEVELS.map(() => 0), music: true, sfx: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.stars)) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rand = (a, b) => a + Math.random() * (b - a);

/* =====================================================================
   AUDIO — everything synthesized with WebAudio
   ===================================================================== */
const Sound = (() => {
  let ac = null, master, sfxG, musG, noiseBuf, slide, charge, musTimer = null;
  let song = 0, step = 0, nextT = 0;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = save.sfx ? 1 : 0; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = save.music ? .32 : 0; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // continuous slide rumble: lowpassed noise, gain follows speed
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 1.2;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(g); g.connect(sfxG); src.start();
    slide = { g, lp };
    // wind-up tone while holding
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = 200;
    const cg = ac.createGain(); cg.gain.value = 0; o.connect(cg); cg.connect(sfxG); o.start();
    charge = { o, g: cg };
    nextT = ac.currentTime + .1;
    musTimer = setInterval(schedule, 40);
  }

  function env(node, t, a, peak, dur) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(peak, t + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function tone(f, type, t, dur, vol, out = sfxG, f2 = null, attack = .004) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, attack, vol, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, vol, type = 'highpass', freq = 2000, out = sfxG, q = .7) {
    if (!ac) return;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); env(g, t, .002, vol, dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random()); s.stop(t + dur + .05);
  }
  const now = () => ac ? ac.currentTime : 0;

  // bell-like chime (harmonic partials, long tail)
  function chime(f, t, vol) {
    [[1, 1], [2, .5], [3, .28], [4.02, .16], [5.03, .08]].forEach(([m, a]) => tone(f * m, 'sine', t, 1.1 / Math.sqrt(m), vol * a));
  }

  const fx = {
    click() { const t = now(); tone(880, 'square', t, .05, .05); tone(1320, 'sine', t + .02, .06, .05); },
    release(p) { const t = now(); noise(t, .25, .25 + p * .2, 'lowpass', 500, sfxG); tone(160, 'sine', t, .12, .25, sfxG, 70); },
    ding(perfect) { const t = now(); chime(784, t, .18); chime(1047, t + .08, .16); if (perfect) chime(1568, t + .16, .14); },
    clink(v) { const t = now(), vol = clamp(v / 900, .05, .25); tone(2600, 'sine', t, .18, vol); tone(3720, 'sine', t, .12, vol * .6); },
    thunk() { const t = now(); tone(140, 'sine', t, .15, .35, sfxG, 60); noise(t, .06, .12, 'lowpass', 800); },
    bump() { const t = now(); tone(220, 'sine', t, .08, .2, sfxG, 120); },
    shatter() {
      const t = now(); noise(t, .55, .4, 'highpass', 2500); noise(t, .2, .3, 'bandpass', 900, sfxG, 1);
      for (let i = 0; i < 9; i++) tone(rand(2200, 6000), 'sine', t + rand(0, .3), rand(.05, .18), rand(.04, .1));
    },
    splat() { const t = now(); noise(t, .35, .35, 'lowpass', 600); tone(300, 'sine', t, .25, .2, sfxG, 90); },
    fall() { const t = now(); tone(900, 'sine', t, .55, .12, sfxG, 180); },
    zap() { const t = now(); tone(1800, 'sawtooth', t, .3, .12, sfxG, 120); noise(t, .3, .2, 'bandpass', 3000, sfxG, 4); },
    miss() { const t = now(); tone(392, 'triangle', t, .18, .16); tone(311, 'triangle', t + .16, .3, .16); },
    pinch() { const t = now(); tone(1500, 'square', t, .03, .05); tone(1200, 'square', t + .06, .03, .05); },
    fanfare() {
      const t = now();
      [523, 659, 784, 1047].forEach((f, i) => { tone(f, 'triangle', t + i * .11, .3, .18); tone(f * 2, 'sine', t + i * .11, .2, .05); });
      chime(1047, t + .5, .2); chime(1319, t + .58, .16); chime(1568, t + .66, .14);
    },
    whoosh() { const t = now(); noise(t, .4, .2, 'bandpass', 1200, sfxG, .8); },
  };

  function setSlide(level) {
    if (!ac) return; const t = ac.currentTime;
    slide.g.gain.setTargetAtTime(clamp(level, 0, 1) * .55, t, .04);
    slide.lp.frequency.setTargetAtTime(300 + clamp(level, 0, 1) * 1400, t, .05);
  }
  function setCharge(on, p) {
    if (!ac) return; const t = ac.currentTime;
    charge.g.gain.setTargetAtTime(on ? .035 : 0, t, .02);
    charge.o.frequency.setTargetAtTime(180 + p * 620, t, .015);
  }

  // ---------- jukebox: I–vi–IV–V doo-wop loop, re-voiced per world ----------
  const SONGS = [
    { bpm: 138, tr: 0, lead: 'triangle', stab: 'square', swing: .1 },   // diner
    { bpm: 112, tr: -3, lead: 'sawtooth', stab: 'sawtooth', swing: 0 }, // neon
    { bpm: 120, tr: 5, lead: 'triangle', stab: 'triangle', swing: .16 },// boardwalk
    { bpm: 96, tr: -5, lead: 'sine', stab: 'sine', swing: 0 },          // orbit
  ];
  const PROG = [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]];
  const MEL = [[76, 0, 79, 0, 81, 79, 76, 0], [76, 0, 72, 0, 74, 72, 69, 0], [72, 0, 77, 0, 76, 74, 72, 0], [74, 0, 71, 0, 74, 0, 79, 0]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function schedule() {
    if (!ac) return;
    const S = SONGS[song], e8 = 60 / S.bpm / 2;
    while (nextT < ac.currentTime + .2) {
      const bar = Math.floor(step / 8) % 4, b8 = step % 8, loop = Math.floor(step / 32) % 4;
      const t = nextT + (b8 % 2 ? e8 * S.swing : 0);
      const ch = PROG[bar], root = 48 + ch[0] + S.tr, minor = ch[1] - ch[0] === 3;
      if (b8 % 2 === 0) {
        const walk = minor ? [0, 3, 7, 10] : [0, 4, 7, 9];
        tone(mtof(root - 12 + walk[b8 / 2]), 'triangle', t, e8 * 1.7, .5, musG);
      }
      if (b8 === 2 || b8 === 6 || b8 === 7) ch.forEach(n => tone(mtof(60 + n + S.tr), S.stab, t, e8 * .8, S.stab === 'square' || S.stab === 'sawtooth' ? .035 : .07, musG));
      if (b8 === 0 || b8 === 4) tone(110, 'sine', t, .16, .55, musG, 45);
      if (b8 === 2 || b8 === 6) noise(t, .12, .16, 'bandpass', 1800, musG, .6);
      noise(t, .03, .04, 'highpass', 7000, musG);
      const m = MEL[bar][b8];
      if (m && (loop === 1 || loop === 2)) tone(mtof(m + S.tr), S.lead, t, e8 * 1.6, S.lead === 'sawtooth' ? .04 : .09, musG, null, .02);
      nextT += e8; step++;
    }
  }
  function setSong(i) { if (song !== i) { song = i; step = 0; } }
  function apply() {
    if (!ac) return; const t = ac.currentTime;
    sfxG.gain.setTargetAtTime(save.sfx ? 1 : 0, t, .02);
    musG.gain.setTargetAtTime(save.music ? .32 : 0, t, .05);
  }
  return { init, fx, setSlide, setCharge, setSong, apply };
})();

/* =====================================================================
   LEVEL + PHYSICS
   ===================================================================== */
function buildLevel(idx) {
  const wi = Math.floor(idx / 5), W = WORLDS[wi], L = LEVELS[idx];
  const gaps = (L.gaps || []).slice().sort((a, b) => a[0] - b[0]);
  const segs = []; let a = -600;
  for (const g of gaps) { segs.push([a, g[0]]); a = g[1]; }
  segs.push([a, L.end]);
  const lv = {
    idx, wi, world: W, end: L.end, zone: L.zone, segs, gaps, tip: L.tip || '',
    surf: L.surf || [], belts: L.belts || [],
    obs: (L.obs || []).map(o => ({ ...o, hw: 15 })),
    gates: (L.gates || []).map(g => ({ ...g, hw: g.k === 'laser' ? 5 : g.k === 'crab' ? 26 : 34, open: 1, wasBlocked: false })),

const game = {

// ---------- input ----------
function pressStart() {

  if (game.phase === 'intro') { game.phase = 'aim'; return; }
  if (game.phase === 'aim' && game.cur.spawn >= 1) { game.phase = 'charge'; game.chargeT = 0; game.power = 0; }
}
function pressEnd() {
  if (game.screen !== 'game' || game.phase !== 'charge') return;
  const lv = game.lv, s = game.cur;
  s.v = powerToV(lv, game.power);
  Sound.setCharge(false, 0); Sound.fx.release(game.power);

cv.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(); });
window.addEventListener('pointerup', pressEnd);

window.addEventListener('keydown', e => {

// ---------- update ----------
function update(dt) {
  const lv = game.lv;
  if (game.paused) { Sound.setSlide(0); Sound.setCharge(false, 0); return; }
  game.t += dt;
  for (const g of lv.gates) {
    const prev = g.open; g.open = gateState(g, game.t);
    if (g.k === 'crab' && prev >= .5 && g.open < .5 && onScreen(g.x)) Sound.fx.pinch();
  }
  for (const s of game.shakes) if (s.spawn < 1) s.spawn = Math.min(1, s.spawn + dt * 3.5);

  if (game.screen !== 'game') {               // attract mode on the title
    game.cam = lerp(game.cam, -60 + Math.sin(game.t * .15) * 40, .02);
    updateFx(dt); return;
  }

  let camTarget = game.cam;
  if (game.phase === 'intro') {
    game.introT += dt;
    const zc = camZone(), ac = camAim(), T = game.introT;
    camTarget = T < 1.1 ? zc : T < 2.1 ? lerp(zc, ac, ease((T - 1.1) / 1)) : ac;
    game.cam = camTarget;
    if (T > 2.1) game.phase = 'aim';
  } else if (game.phase === 'aim') {
    camTarget = camAim();
  } else if (game.phase === 'charge') {
    camTarget = camAim();
    game.chargeT += dt;
    const ph = (game.chargeT / lv.meter) % 1;
    game.power = ph < .5 ? ph * 2 : 2 - ph * 2;
    Sound.setCharge(true, game.power);
  } else if (game.phase === 'moving' || game.phase === 'judge') {
    const movers = game.shakes.filter(s => !s.gone && (Math.abs(s.v) > 1 || s.falling));
    const follow = movers.length ? movers.reduce((a, b) => Math.abs(b.v) > Math.abs(a.v) ? b : a) : null;
    camTarget = follow ? clampCam(follow.x - VW * .42) : game.cam;
  }
  if (game.phase !== 'intro') game.cam = lerp(game.cam, camTarget, 1 - Math.pow(.002, dt));

  if (game.phase === 'moving' || game.phase === 'judge') physics(dt);
  else Sound.setSlide(0);

  if (game.phase === 'moving') {
    game.moveT += dt;
    const busy = game.shakes.some(s => !s.gone && (s.v !== 0 || s.falling || s.crash > 0));
    if (!busy || game.moveT > 16) judge();
  } else if (game.phase === 'judge') {
    game.judgeT -= dt;
    if (game.judgeT <= 0) afterJudge();
  }
  if (game.thrown > 0 && game.tipAlpha > 0) game.tipAlpha = Math.max(0, game.tipAlpha - dt * 1.5);
  updateFx(dt);
}
const onScreen = x => x > game.cam - 80 && x < game.cam + VW + 80;

function physics(dt) {
  const lv = game.lv, h = 1 / 240;
  let n = Math.ceil(dt / h); const sdt = dt / n;
  while (n--) {
    for (const s of game.shakes) {
      const ev = stepShake(lv, s, sdt);
      if (ev === 'drop') { Sound.fx.fall(); }
      else if (ev === 'land') { Sound.fx.bump(); dust(s.x, CY, 4); }
      else if (ev === 'smash') { Sound.fx.shatter(); shards(s.x, CY + 200, s.flavor); }
      else if (ev === 'crashdone') {}
      if (s.gone || s.crash > 0 || s.y > LAND_TOL) continue;
      // blockers: bottles + closed gates
      for (const o of lv.obs) collideBlock(s, o.x, o.hw, false, o);
      for (const g of lv.gates) {
        if (g.k === 'laser') {
          if (gateBlocked(g) && Math.abs(s.x - g.x) < HW + g.hw) zapShake(s, g);
        } else if (gateBlocked(g)) collideBlock(s, g.x, g.hw, false, g);
      }
    }
    // shake vs shake (equal masses, slightly lossy)
    const live = game.shakes.filter(s => !s.gone && s.crash === 0 && s.y < LAND_TOL).sort((a, b) => a.x - b.x);
    for (let i = 0; i < live.length - 1; i++) {

}
function zapShake(s, g) {

}

function judge() {
  const lv = game.lv, z = lv.zone, cur = game.cur;
  const inZone = s => !s.gone && s.crash === 0 && !s.falling && s.x >= z[0] && s.x <= z[1];
  const prev = game.shakes.filter(s => s !== cur);
  const ok = inZone(cur) && prev.every(inZone);
  Sound.setSlide(0);
  if (ok) {
    cur.landed = true; game.landedN++;
    const perfect = Math.abs(cur.x - (z[0] + z[1]) / 2) < 10;
    Sound.fx.ding(perfect);
    sparkle(cur.x, CY - 80, '#ffe866', perfect ? 30 : 16);
    floatText(cur.x, CY - 150, perfect ? 'Perfect!' : ['Order up!', 'Nice slide!', 'Smooth!'][game.landedN % 3], '#ffffff', '#2e9e45');
    game.result = 'ok'; game.judgeT = game.landedN >= SHAKES_PER_LEVEL ? 1.3 : .9;
  } else {
    let msg;
    if (cur.zapped) msg = 'Zapped!';
    else if (cur.crash > 0 || (cur.gone && !cur.lost)) msg = 'Spilled!';
    else if (cur.gone || cur.lost) msg = 'Dropped it!';
    else if (!prev.every(inZone)) msg = 'Knocked one out!';
    else if (cur.x < z[0]) msg = 'Too short!';
    else msg = 'Too far!';
    game.misses++; Sound.fx.miss();
    const fx = cur.gone ? clamp(cur.x, game.cam + 120, game.cam + VW - 120) : cur.x;
    floatText(fx, CY - 150, msg, '#ffffff', '#d8203f');

    game.shakes = game.shakes.filter(s => s !== game.cur);
    for (const { o, x } of game.snap) Object.assign(o, { x, px: x, v: 0, y: 0, vy: 0, rot: 0, vr: 0, falling: false, lost: false, gone: false, crash: 0, zapped: 0, spawn: o.gone ? 0 : 1 });

}
function levelComplete() {
  game.phase = 'done';
  const stars = game.misses === 0 ? 3 : game.misses <= 2 ? 2 : 1;
  const i = game.lv.idx;
  save.stars[i] = Math.max(save.stars[i] || 0, stars); persist();
  Sound.fx.fanfare();
  const last = i === LEVELS.length - 1;
  document.getElementById('doneTitle').textContent = last ? 'Head Soda Slinger!' : 'Order Up!';
  document.getElementById('doneStars').innerHTML = [0, 1, 2].map(k => `<span class="${k < stars ? 'on' : 'off'}">★</span>`).join('');
  document.getElementById('doneMsg').textContent = last
    ? `You served every counter in town${game.misses ? ` with ${game.misses} spill${game.misses > 1 ? 's' : ''} on the last one` : ' — flawless'}.`
    : game.misses === 0 ? 'Three for three. Not a drop spilled.' : `${game.misses} miss${game.misses > 1 ? 'es' : ''} on the way. ${stars < 3 ? 'Go again for 3 stars?' : ''}`;
  document.getElementById('doneNext').hidden = last;
  setTimeout(() => { if (game.phase === 'done') showScreen('done'); }, 650);
}

const FLAVORS = {

function splash(x, y, fl, n, dir) {
  const F = FLAVORS[fl];
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: dir * rand(60, 380) + rand(-80, 80), vy: rand(-520, -120), life: rand(.6, 1.1), t: 0, col: Math.random() < .3 ? '#fffaf2' : F.body, r: rand(3, 7), g: 1, kind: 'drop' });
}
function shards(x, y, fl) {

  for (let i = 0; i < 14; i++) particles.push({ x, y, vx: rand(-300, 300), vy: rand(-500, -150), life: rand(.6, 1), t: 0, col: 'rgba(220,245,255,.9)', r: rand(3, 7), g: 1, kind: 'shard', a: rand(0, 6) });
}
function sparkle(x, y, col, n) {

}
function dust(x, y, n) { for (let i = 0; i < n; i++) particles.push({ x: x + rand(-15, 15), y, vx: rand(-60, 60), vy: rand(-90, -30), life: .4, t: 0, col: 'rgba(255,255,255,.7)', r: rand(3, 5), g: 0, kind: 'drop' }); }

function updateFx(dt) {

function draw() {
  const c = ctx, lv = game.lv, T = THEMES[lv.world.theme], cam = game.cam;
  c.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
  BG[lv.world.theme](c, cam, T);
  c.save(); c.translate(-cam, 0);
  drawLights(c, cam, T, lv.world.theme, 'back');
  // crabs pop up from behind the counter, so they go before it
  for (const g of lv.gates) if (g.k === 'crab') drawCrab(c, g);
  drawCounter(c, lv, T, cam);
  for (const g of lv.gates) if (g.k === 'laser') drawLaser(c, g, true);
  for (const o of lv.obs) drawBottle(c, o, T, lv.world.theme);
  for (const g of lv.gates) if (g.k === 'dome') drawDome(c, g, lv.world.theme);
  for (const s of game.shakes) if (!s.gone) drawShake(c, s.x, CY + s.y, s.rot, s.flavor, s.spawn, s);
  for (const g of lv.gates) if (g.k === 'laser') drawLaser(c, g, false);
  drawStools(c, cam, T, lv.world.theme);
  drawLights(c, cam, T, lv.world.theme, 'front');
  if (game.screen === 'game') drawAim(c);
  drawFx(c);
  c.restore();
  if (game.screen === 'game') drawHUD(c, lv);
}

}
const BG = {
  diner(c, cam, T) {
    c.fillStyle = '#43c2ce'; c.fillRect(0, 0, VW, VH);
    // painterly streaks like a cartoon wall
    c.fillStyle = 'rgba(255,255,255,.14)';

  if (lift > 2) { c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(x, CY - 63 - lift); c.lineTo(x, Math.max(0, CY - 400)); c.stroke(); c.setLineDash([]); }
}
function drawCrab(c, g) {
  const pres = 1 - g.open, x = g.x, y = CY - 4 + (1 - pres) * 46;
  c.save(); c.beginPath(); c.rect(x - 80, 0, 160, CY - 4); c.clip();
  c.translate(x, y);
  const sn = Math.sin(game.t * 14) * pres;
  c.fillStyle = '#e8432f';
  c.lineWidth = 4; c.strokeStyle = '#c22f20';
  for (let k = -1; k <= 1; k += 2) for (let l = 0; l < 3; l++) { c.beginPath(); c.moveTo(k * 14, -10); c.lineTo(k * (28 + l * 4), -2 + l * 3 + (l % 2 ? sn * 2 : -sn * 2)); c.stroke(); }
  c.beginPath(); c.ellipse(0, -16, 24, 14, 0, 0, 7); c.fill();
  for (let k = -1; k <= 1; k += 2) {
    c.save(); c.translate(k * 26, -30); c.rotate(k * (.3 + sn * .2));
    c.beginPath(); c.arc(0, 0, 10, 0, 7); c.fill();
    c.fillStyle = '#ffbfb5'; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 10, -.6 - Math.abs(sn) * .4, .1); c.fill(); c.fillStyle = '#e8432f';
    c.restore();
  }
  c.fillStyle = '#fff'; [-8, 8].forEach(d => { c.fillRect(d - 1, -38, 2, 10); c.beginPath(); c.arc(d, -40, 5, 0, 7); c.fill(); });
  c.fillStyle = '#1d1d26'; [-8, 8].forEach(d => { c.beginPath(); c.arc(d + 1, -40, 2.4, 0, 7); c.fill(); });
  c.restore();
}
function drawLaser(c, g, back) {
  const x = g.x, on = gateBlocked(g), warn = !on && laserWarn(g, game.t);
  if (back) {
    c.fillStyle = '#5a6478'; roundRect(c, x - 12, CY - 140, 24, 18, 6); c.fill();
    c.fillStyle = on ? '#ff4d6d' : warn ? (Math.sin(game.t * 40) > 0 ? '#ffb3c0' : '#5a1020') : '#5a1020';
    c.beginPath(); c.arc(x, CY - 122, 5, 0, 7); c.fill();
    return;
  }
  if (on) {
    c.save(); c.shadowColor = '#ff2d55'; c.shadowBlur = 20;
    c.fillStyle = 'rgba(255,60,90,.9)'; c.fillRect(x - 3, CY - 120, 6, 116);
    c.fillStyle = '#fff'; c.fillRect(x - 1, CY - 120, 2, 116);
    c.restore();
  } else if (warn) { c.fillStyle = 'rgba(255,80,110,.25)'; c.fillRect(x - 1, CY - 120, 2, 116); }
}

// ---------- the milkshake ----------
function drawShake(c, x, y, rot, flavor, spawn, s) {
  const F = FLAVORS[flavor], sc = .9 * (spawn < 1 ? ease(spawn) * 1.1 - (spawn > .8 ? (spawn - .8) * .5 : 0) : 1);
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  const drained = s && s.crash > 0 ? clamp(s.crash * 1.4, 0, 1) : 0;
  // shadow
  if (!s || (!s.falling && s.crash === 0)) { c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(0, 0, 22, 4, 0, 0, 7); c.fill(); }
  // straw (behind)
  c.save(); c.translate(-6, -84); c.rotate(-.32);
  c.fillStyle = '#fff'; c.fillRect(-3, -50, 6, 52);
  c.fillStyle = '#e3263a'; for (let k = 0; k < 5; k++) c.fillRect(-3, -50 + k * 11, 6, 5);
  c.restore();
  // foot + stem
  c.fillStyle = 'rgba(225,245,255,.92)'; c.strokeStyle = 'rgba(120,170,200,.8)'; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(0, -3, 17, 4, 0, 0, 7); c.fill(); c.stroke();
  c.fillRect(-4, -18, 8, 15);
  // bowl contents
  const bowl = () => { c.beginPath(); c.moveTo(-8, -18); c.bezierCurveTo(-20, -28, -22, -58, -24, -76); c.lineTo(24, -76); c.bezierCurveTo(22, -58, 20, -28, 8, -18); c.closePath(); };
  c.save(); bowl(); c.clip();
  const lvl = -76 + drained * 58;
  const lg = c.createLinearGradient(-24, 0, 24, 0); lg.addColorStop(0, F.dk); lg.addColorStop(.35, F.body); lg.addColorStop(.6, F.hi); lg.addColorStop(1, F.dk);
  c.fillStyle = lg; c.fillRect(-26, lvl, 52, 60);
  if (flavor === 'galaxy') { c.fillStyle = '#fff'; for (let k = 0; k < 7; k++) c.fillRect(-14 + hash(k) * 28, -70 + hash(k + 3) * 46, 2, 2); }
  // flutes
  c.fillStyle = 'rgba(255,255,255,.18)'; for (let k = -2; k <= 2; k++) c.fillRect(k * 8 - 1, -76, 3, 60);
  c.restore();
  bowl(); c.fillStyle = 'rgba(220,245,255,.18)'; c.fill(); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-14, -50, 3, 14, .15, 0, 7); c.fill();
  // rim
  c.fillStyle = 'rgba(235,250,255,.95)'; c.beginPath(); c.ellipse(0, -76, 25, 4, 0, 0, 7); c.fill();
  if (drained < .5) {
    // whipped cream + cherry
    const cream = (cx, cy, r) => { c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); };
    c.fillStyle = '#e9e2e6'; cream(-12, -80, 11); cream(12, -80, 11); cream(0, -84, 13);
    c.fillStyle = '#fffaf6'; cream(-11, -83, 10); cream(11, -83, 10); cream(0, -88, 12); cream(-2, -99, 9); cream(1, -107, 5.5);
    c.fillStyle = '#e9e2e6'; c.beginPath(); c.arc(4, -95, 5, 0, Math.PI); c.fill();
    c.strokeStyle = '#3d7a2a'; c.lineWidth = 2; c.beginPath(); c.moveTo(7, -114); c.quadraticCurveTo(12, -126, 18, -128); c.stroke();
    c.fillStyle = '#d6102c'; c.beginPath(); c.arc(7, -112, 6.5, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(5, -115, 2, 0, 7); c.fill();
  }
  if (s && s.zapped) { c.globalAlpha = .45; c.fillStyle = '#1d1d26'; bowl(); c.fill(); c.globalAlpha = 1; }
  c.restore();
}

// ---------- aim arrow ----------
function drawAim(c) {
  const s = game.cur; if (!s || s.gone) return;
  const x = s.x + HW + 10, y = CY - 40;
  if (game.phase === 'aim' && s.spawn >= 1) {
    const pulse = 1 + Math.sin(game.t * 6) * .08;
    c.save(); c.translate(x + 30, y); c.scale(pulse, pulse);
    arrow(c, -26, 0, 64, '#2f8cff', '#1b5fc4');
    c.restore();
  } else if (game.phase === 'charge') {
    const len = 50 + game.power * 260;
    const col = game.power > .85 ? '#ff4d3a' : game.power > .6 ? '#ffc83a' : '#4fd36a';
    const dk = game.power > .85 ? '#b3261a' : game.power > .6 ? '#c08c10' : '#2a9a45';
    arrow(c, x, y, len, col, dk);
  }
}
function arrow(c, x, y, len, col, dk) {
  const h = 22;
  c.fillStyle = dk; roundRect(c, x, y - h / 2 + 3, len - 12, h, 6); c.fill();
  c.fillStyle = col; roundRect(c, x, y - h / 2, len - 12, h, 6); c.fill();
  c.beginPath(); c.moveTo(x + len - 18, y - 19); c.lineTo(x + len + 10, y); c.lineTo(x + len - 18, y + 19); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,.95)';
  for (let k = x + 8; k < x + len - 24; k += 20) { c.beginPath(); c.moveTo(k, y - 6); c.lineTo(k + 7, y); c.lineTo(k, y + 6); c.lineTo(k + 4, y + 6); c.lineTo(k + 11, y); c.lineTo(k + 4, y - 6); c.fill(); }
}

function drawFx(c) {
  for (const p of particles) {
    const a = 1 - p.t / p.life; c.globalAlpha = clamp(a * 1.4, 0, 1); c.fillStyle = p.col;
    if (p.kind === 'shard') { c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.beginPath(); c.moveTo(-p.r, 0); c.lineTo(0, -p.r * 1.6); c.lineTo(p.r, p.r * .4); c.fill(); c.restore(); }
    else if (p.kind === 'star') { c.fillRect(p.x - p.r, p.y - .8, p.r * 2, 1.6); c.fillRect(p.x - .8, p.y - p.r, 1.6, p.r * 2); }
    else { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1;
  for (const t of texts) {
    const k = t.t, sc = k < .15 ? ease(k / .15) * 1.15 : 1, a = k > 1 ? 1 - (k - 1) / .4 : 1;
    c.save(); c.globalAlpha = clamp(a, 0, 1); c.translate(t.x, t.y - k * 30); c.scale(sc, sc); c.rotate(-.05);
    c.font = '38px "Lilita One", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineJoin = 'round'; c.lineWidth = 9; c.strokeStyle = '#1d1d26'; c.strokeText(t.text, 0, 3);
    c.lineWidth = 7; c.strokeStyle = t.stroke; c.strokeText(t.text, 0, 0);
    c.fillStyle = t.col; c.fillText(t.text, 0, 0);
    c.restore();
  }
}

// ---------- HUD ----------
function drawHUD(c, lv) {
  const L = SAFE.l + 14, Tp = SAFE.t + 12;
  // logo blob
  c.save(); c.translate(L + 82, Tp + 46); c.rotate(-.08);
  c.fillStyle = '#1d1d26'; blob(c, 2, 5, 84, 42); c.fill();
  c.fillStyle = '#e8223f'; blob(c, 0, 0, 84, 42); c.fill();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.font = '27px "Lilita One", sans-serif'; c.fillStyle = '#a8102a'; c.fillText('SODA', 2, -13); c.fillStyle = '#fff'; c.fillText('SODA', 0, -15);
  c.font = '31px "Lilita One", sans-serif'; c.fillStyle = '#a8102a'; c.fillText('SLINGER', 2, 15); c.fillStyle = '#fff'; c.fillText('SLINGER', 0, 13);
  c.restore();
  // level card
  const cx = VW / 2, wide = VW < 560;
  const sx = wide ? Math.max(cx, L + 190 + 85) : cx, sy = Tp + (wide ? 104 : 8);
  c.save(); c.translate(sx, sy); c.rotate(-.03);
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.moveTo(-100, 6); c.lineTo(108, 2); c.lineTo(104, 92); c.lineTo(-96, 96); c.fill();
  c.fillStyle = '#e8336f';
  c.beginPath(); c.moveTo(-110, -2); c.lineTo(-76, -2); c.lineTo(-104, 30); c.fill();
  c.beginPath(); c.moveTo(110, 88); c.lineTo(76, 90); c.lineTo(104, 58); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-104, 0); c.lineTo(104, -4); c.lineTo(100, 86); c.lineTo(-100, 90); c.closePath(); c.fill();
  c.fillStyle = '#1d1d26'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '28px "Lilita One", sans-serif'; c.fillText(`Level ${lv.idx + 1}`, 0, 26);
  c.lineWidth = 4; c.strokeStyle = '#1d1d26'; c.beginPath(); c.moveTo(-36, 58); c.lineTo(36, 58); c.stroke();
  for (let k = 0; k < SHAKES_PER_LEVEL; k++) {
    const dx = -36 + k * 36, done = k < game.landedN;
    c.save(); c.translate(dx, 58); c.rotate(Math.PI / 4);
    c.fillStyle = done ? '#4fd36a' : '#1d1d26'; const r = done ? 8 : 6; c.fillRect(-r, -r, r * 2, r * 2);
    if (done) { c.strokeStyle = '#1d1d26'; c.lineWidth = 2.5; c.strokeRect(-r, -r, r * 2, r * 2); }
    c.restore();
  }
  c.restore();
  // world name
  c.font = '15px "Fredoka", sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.9)';
  c.fillText(`${lv.world.name}${game.misses ? `  ·  misses ${game.misses}` : ''}`, sx, sy + 112);
  // off-screen zone marker
  const zc = (lv.zone[0] + lv.zone[1]) / 2, sxz = zc - game.cam;
  if (sxz > VW - 10 && game.phase !== 'intro') {
    const ax = VW - SAFE.r - 40, ay = CY - 50, d = Math.round((lv.zone[0] - game.cur.x) / 10);
    c.save(); c.translate(ax, ay);
    c.fillStyle = '#2a9a45'; roundRect(c, -28, -16, 56, 34, 17); c.fill();
    c.fillStyle = '#4fd36a'; roundRect(c, -28, -19, 56, 34, 17); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-12, -9); c.lineTo(4, -9); c.lineTo(4, -15); c.lineTo(17, -2); c.lineTo(4, 11); c.lineTo(4, 5); c.lineTo(-12, 5); c.fill();
    if (d > 0) { c.font = '14px "Fredoka", sans-serif'; c.fillStyle = '#fff'; c.fillText(`${d} ft`, 0, 34); }
    c.restore();
  }
  // intro label + tips
  if (game.phase === 'intro' && game.introT < 1.2) {
    const zx = zc - game.cam;
    c.save(); c.globalAlpha = Math.min(1, game.introT * 4);
    c.font = '30px "Lilita One", sans-serif'; c.textAlign = 'center'; c.lineJoin = 'round';
    c.lineWidth = 7; c.strokeStyle = '#1d1d26'; c.strokeText('Deliver here!', zx, CY - 90);
    c.fillStyle = '#a6f59a'; c.fillText('Deliver here!', zx, CY - 90);
    c.beginPath(); c.moveTo(zx - 12, CY - 70); c.lineTo(zx + 12, CY - 70); c.lineTo(zx, CY - 54); c.fill();
    c.restore();
  }
  if (lv.tip && game.tipAlpha > 0) {
    const y = Math.min(VH - SAFE.b - 26, CY + 150);
    c.save(); c.globalAlpha = Math.min(1, game.tipAlpha);
    c.font = '20px "Fredoka", sans-serif'; c.textAlign = 'center';
    const w = c.measureText(lv.tip).width + 36;
    c.fillStyle = 'rgba(29,29,38,.82)'; roundRect(c, VW / 2 - w / 2, y - 22, w, 38, 19); c.fill();
    c.fillStyle = '#fff'; c.fillText(lv.tip, VW / 2, y + 4);
    c.restore();
  }
}
function blob(c, x, y, rx, ry) {
  c.beginPath();
  for (let i = 0; i <= 24; i++) { const a = i / 24 * Math.PI * 2, r = 1 + Math.sin(a * 3) * .05 + Math.cos(a * 2) * .04; const px = x + Math.cos(a) * rx * r, py = y + Math.sin(a) * ry * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* =====================================================================
   SCREENS (DOM)
   ===================================================================== */
const $ = id => document.getElementById(id);
function showScreen(id) {
  for (const s of ['title', 'worlds', 'pause', 'done']) $(s).hidden = s !== id;
  $('pauseBtn').hidden = !(game.screen === 'game' && !id);
}
function buildWorlds() {
  const swatch = ['linear-gradient(135deg,#43c2ce,#e8336f)', 'linear-gradient(135deg,#251040,#ff3fa4)', 'linear-gradient(135deg,#ff8a6b,#2f9fc4)', 'linear-gradient(135deg,#0a0f2c,#3ad7ff)'];
  $('worldList').innerHTML = WORLDS.map((w, wi) => {
    const got = save.stars.slice(wi * 5, wi * 5 + 5).reduce((a, b) => a + b, 0);
    return `<div class="world" style="background:${swatch[wi]}">
      <div class="wname"><span>${w.name}</span><small>★ ${got}/15</small></div>
      <small style="font-weight:600;margin-top:-6px">${w.tag}</small>
      <div class="levels">${[0, 1, 2, 3, 4].map(k => {
        const i = wi * 5 + k, open = i === 0 || save.stars[i - 1] > 0, st = save.stars[i] || 0;
        return `<button class="lvl" data-lvl="${i}" ${open ? '' : 'disabled'} aria-label="Level ${i + 1}${open ? '' : ' (locked)'}">${open ? i + 1 : '🔒'}<span class="st">${open ? '★'.repeat(st) + '☆'.repeat(3 - st) : ''}</span></button>`;
      }).join('')}</div></div>`;
  }).join('');
}
$('worldList').addEventListener('click', e => {
  const b = e.target.closest('.lvl'); if (!b || b.disabled) return;
  Sound.init(); Sound.fx.click(); startLevel(+b.dataset.lvl);
});
$('playBtn').onclick = () => { Sound.init(); Sound.fx.click(); buildWorlds(); showScreen('worlds'); };
$('backTitle').onclick = () => { Sound.fx.click(); toTitle(); };
function toTitle() { game.screen = 'title'; game.lv = buildLevel(0); game.lv.end = 5000; game.lv.segs = [[-600, 5000]]; game.lv.zone = [-900, -800]; game.shakes = [newShake(START_X + 40, 'choc')]; game.shakes[0].spawn = 1; game.phase = 'attract'; Sound.setSong(0); showScreen('title'); }
function togglePause(p) {
  if (game.phase === 'done') return;
  game.paused = p; if (p) pressEndSilent(); Sound.fx.click(); showScreen(p ? 'pause' : null);
}
function pressEndSilent() { if (game.phase === 'charge') { game.phase = 'aim'; Sound.setCharge(false, 0); } }
$('pauseBtn').onclick = () => { Sound.init(); togglePause(true); };
$('resumeBtn').onclick = () => togglePause(false);
$('restartBtn').onclick = () => { Sound.fx.click(); startLevel(game.lv.idx); };
$('levelsBtn').onclick = () => { Sound.fx.click(); game.screen = 'menu'; game.paused = false; buildWorlds(); showScreen('worlds'); };
$('doneLevels').onclick = () => { Sound.fx.click(); game.screen = 'menu'; buildWorlds(); showScreen('worlds'); };
$('doneRetry').onclick = () => { Sound.fx.click(); startLevel(game.lv.idx); };
$('doneNext').onclick = () => { Sound.fx.click(); startLevel(Math.min(LEVELS.length - 1, game.lv.idx + 1)); };
function syncToggles() {
  ['musT1', 'musT2'].forEach(id => $(id).setAttribute('aria-pressed', String(save.music)));
  ['sfxT1', 'sfxT2'].forEach(id => $(id).setAttribute('aria-pressed', String(save.sfx)));
}
['musT1', 'musT2'].forEach(id => $(id).onclick = () => { Sound.init(); save.music = !save.music; persist(); syncToggles(); Sound.apply(); });
['sfxT1', 'sfxT2'].forEach(id => $(id).onclick = () => { Sound.init(); save.sfx = !save.sfx; persist(); syncToggles(); Sound.apply(); Sound.fx.click(); });
syncToggles();

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});

// test hook: rolls out every throw strength on each level and reports the landing window
window.__sodaSlingerTest = () => LEVELS.map((L, i) => {
  const lv = buildLevel(i); let ok = 0, n = 1000;
  for (let k = 0; k <= n; k++) { const r = simThrow(lv, powerToV(lv, k / n)); if (!r.fell && r.x >= lv.zone[0] && r.x <= lv.zone[1]) ok++; }
  return { level: i + 1, vmax: lv.vmax, window: +(ok / n).toFixed(3), ms: Math.round(ok / n * lv.meter / 2 * 1000) };
});
</script>
